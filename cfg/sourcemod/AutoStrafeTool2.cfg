// ============================================================
// AutoStrafeTool2  v2.7.3 —— 配置文件
// 作者：ST2ange（Steam：STᗜ ‸ ᗜGE  https://steamcommunity.com/id/ST2ange/）｜大肥鱼
// Bilibili：剑聖STR様  https://space.bilibili.com/399718078
// ------------------------------------------------------------
// 进服默认全部关闭；玩家用聊天 !asm 菜单 或 !as / !ab / !asbx 自行开启。
// 改完执行：sm plugins reload AutoStrafeTool2
// ============================================================

// ============================================================
// 一、开关与触发
// ============================================================
sm_autostrafe_autostart "0"        // 新玩家进服自动开加速（0=关，要玩家自己 !as）
sm_autostrafe_bhop "0"             // 新玩家进服自动开连跳（0=关，要玩家自己 !ab）
sm_autostrafe_bhopgrace "0"        // 连跳抗丢包宽限（tick）：0=松手立即停；4-8 抗丢包但松手可能多跳一次
sm_autostrafe_bhopmin "220.0"      // 自动测试时起跳的最低地速（正常游玩不限速）
sm_autostrafe_requiremove "1"      // 1=必须按方向键才接管（普通模式不受影响）
sm_autostrafe_requirejump "0"      // 1=必须按住空格才接管空中加速
sm_autostrafe_hysteresis "0"       // 换边死区（度）：0=每 tick 换边（画面最稳）；调大摆幅变大但更晃

// ============================================================
// 二、加速力度
// ============================================================
sm_autostrafe_power "5"            // 默认力度档位 1-5：1 最弱约 10,000/跳，5 最强 13,980/跳
                                   // 玩家可用 !asd 1-5 或 !asz 自定义数值覆盖

// ============================================================
// 三、视角
// ============================================================
sm_autostrafe_viewfollow "0"       // 1=接管时把视角对准移动方向（可掩盖横向抖动，但会改动你的视角朝向）
sm_autostrafe_mn_cam "1"           // 整跳/半跳是否接管视角：
                                   //   1 = 镜头跟摆动方向转（画面持续旋转，第一次用可能不适应）
                                   //   0 = 完全不碰视角，只摆移动，画面稳如普通模式
sm_autostrafe_mn_cam_rate "3.0"    // 镜头每 tick 最大转角（度）：防起跳瞬间和折返时视角瞬抽
                                   //   3.0 = 与实机录像单帧幅度同量级；1.0 = 更柔和但跟得慢；0 = 不限幅（会抽）

// ============================================================
// 四、物理参数覆盖（一般不要动，除非你知道服务器改了什么）
// ============================================================
sm_autostrafe_enginetruth "1"      // 1=读取引擎当帧真实参数（推荐）；0=旧版推测值
sm_autostrafe_aa "0"               // 0=自动读服务器 sv_airaccelerate；>0 强制覆盖
sm_autostrafe_wishspeed "0"        // 0=自动；>0 强制覆盖
sm_autostrafe_maxspeed "0"         // 0=自动读玩家最大速度；>0 强制
sm_autostrafe_dt "0"               // 0=自动按服务器 tickrate 推算；>0 强制（必须 <=0.1）
sm_autostrafe_friction "0"         // 0=自动（起跳/下落阶段自动切换）；>0 固定摩擦系数
sm_autostrafe_deadfric "0.25"      // 下落阶段使用的摩擦系数
sm_autostrafe_deadvz "125.0"       // 下落阶段的垂直速度判定阈值
sm_autostrafe_deadmode "1"         // 下落阶段判定方式：0=关 1=上升段 2=下降段 3=两边

// ============================================================
// 五、甩视角强拐
// ============================================================
sm_autostrafe_flick "1"            // 1=开启强拐（猛甩鼠标时速度方向跟着快速转过去）；0=关闭
sm_autostrafe_flick_rate "200"     // 视角转速门槛（度/秒）：超过才算"甩"。200=小幅快甩就触发，400=要大甩
sm_autostrafe_flick_deg "25"       // 进入强拐的偏角（度）：视角与移动方向差这么多才触发
                                   //   25=敏感（小幅快甩就拐），45=迟钝（要大甩才拐）
sm_autostrafe_flick_exit "15"      // 退出强拐的偏角（度）：转到差这么多就切回正常加速
sm_autostrafe_flick_turn "6.0"     // 强拐转速（度/tick）：6 = 360度/秒，转 90 度约 0.25 秒
                                   //   10-12 更急，但画面修正感更明显
sm_autostrafe_flick_keep "0.990"   // 强拐期间每 tick 速度保留：0.99 = 转 90 度约损失 14%
                                   //   1.0 = 转弯完全不掉速；0.98 = 掉得快但更像真物理

// ============================================================
// 六、摆动细节（整跳 !mn / 半跳 !mnbt）
// ============================================================
sm_autostrafe_mn_start "1"          // 首跳基准侧：1=第一跳先左（左-右-左），2=第一跳先右（右-左-右）
sm_autostrafe_mn_fwd_flip "0.50"    // 折返时机（滞空进度 0.20~0.95）：
                                    //   0.50 = 过顶点就折返（漂移最小，最稳）
                                    //   0.80 = 摆到接近极限再折返（摆幅最大，落地时已在回程）
                                    //   <0.50 = 上升段就折返，漂移方向反过来
sm_autostrafe_mn_fwd_period "12"    // 长滞空折返周期（tick）：第一次折返后每隔这么多 tick 再折一次
sm_autostrafe_mn_fwd_loop "1"       // 1=长滞空继续按周期折返（高跳低不会一路单侧拐）
                                    // 0=每跳只折一次（落地干净不抽，但高低差会偏航）
sm_autostrafe_mn_fwd_apex "1"       // 1=按顶点折返（推荐）；0=按摆角折返（旧行为，长滞空会蛇形）
sm_autostrafe_mn_fwd_swing "20"     // 单侧摆角（度）：仅 mn_fwd_apex=0 时生效
sm_autostrafe_mn_fwd_extra "0"      // 换向那一帧额外外甩的角度（度）：真实摆动没有瞬转，建议保持 0
sm_autostrafe_mn_swing "34"         // 摆头模式（!asmn 旧版）单侧摆角（度）
sm_autostrafe_mn_brake "0"          // 摆动刹车角（度，0-80）：主动掉速用
                                    //   0=正常；10-20=轻微掉速；30+=速度直接崩（实测 194 → 34）
sm_autostrafe_mn_sloppy "0"         // 垃圾摆动概率（0-100%）：每 tick 有这个概率完全不接管
                                    //   0=每 tick 都加速（正常）；26=模拟真人摆不稳；50=几乎加不动
sm_autostrafe_mn_runup "0"          // 自检助跑秒数：先按住 W 跑满地速再起跳（0=不助跑）

// ============================================================
// 七、避障 —— 墙
// ============================================================
sm_autostrafe_avoid "0"             // 1=贴墙硬拐：提前判断前方是否撞墙，提前换边（默认关）
sm_autostrafe_avoid_contact "3"     // 预测几 tick 内会碰墙就触发（1-8）：越大越早拐
sm_autostrafe_avoid_hold "8"        // 拐弯后保持多少 tick 不换回来（2-16）
sm_autostrafe_avoid_debug "0"       // 1=聊天框输出避障决策（调试）

// ============================================================
// 八、避障 —— 僵尸 / 特感 / Witch
// ============================================================
sm_autostrafe_avoid_mob "0"         // 1=空中避让：自动绕开前方的普通僵尸、特感（Hunter/Smoker/Boomer/
                                    //   Spitter/Jockey/Charger）、Tank，以及站着或坐着的 Witch
sm_autostrafe_avoid_mob_range "220" // 探测距离下限（单位）：实际会随速度自动放大到「速度×0.85」
sm_autostrafe_avoid_mob_deg "75"    // 前方探测半角（度）：越大越早发现，但侧面目标也会被算进来
sm_autostrafe_avoid_mob_turn "20"   // 换边迟滞角（度）：目标偏角小于它时保持上次避让方向，防左右来回抖
sm_autostrafe_avoid_mob_hold "12"   // 单次避让最长持续 tick（12≈0.4秒）：超过强制冷却，防止绕着目标转圈
sm_autostrafe_avoid_mob_debug "0"   // 1=输出避让触发/解除（调试）

// ============================================================
// 九、遥测 / 调试（正常游玩保持默认）
// ============================================================
sm_autostrafe_log "0"               // 1=写 CSV 速度日志（logs/autostrafe_l4d2.csv）
sm_autostrafe_logdetail "1"         // 1=只记实际接管；2=连跳过原因也记
sm_autostrafe_debugchat "0"         // 1=每次决策都在聊天区输出
sm_autostrafe_passive "0"           // 1=只记录不改命令（对比用）

// ============================================================
// 十、测试用（正常游玩全部保持 0）
// ============================================================
sm_autostrafe_autotest "0"          // 出生后自动测试多少秒（0=关）
sm_autostrafe_testcircle "0"        // 固定一侧转向绕圈
sm_autostrafe_testduck "0"          // 跑满地速后按住蹲再起跳
sm_autostrafe_mnselftest "0"        // 摆动自检秒数（>0 自动开加速+摆动并写逐 tick 日志）
sm_autostrafe_testmob "0"           // 自动测试期间每隔 N 秒在身前生成一只僵尸（0=关）
sm_autostrafe_testmob_si "0"        // 1=改成生成特感（需要 sv_cheats 1）
