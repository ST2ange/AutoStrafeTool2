// ============================================================
// L4D2 空中自动加速插件 v2.7.3 —— 配置文件
// 作者：ST2ange（Steam：STᗜ ‸ ᗜGE  https://steamcommunity.com/id/ST2ange/）｜大肥鱼
// Bilibili：剑聖STR様  https://space.bilibili.com/399718078
// ------------------------------------------------------------
// 进服默认全部关闭；玩家用聊天 !as / !ab / !asbx 自行开启。
// 修改后执行 sm plugins reload sm_autostrafe_l4d2 生效。
// ============================================================

// ---------------- 开关与触发 ----------------
sm_autostrafe_autostart "0"        // 新玩家进服是否自动开启自动加速（0=关，需 !as）
sm_autostrafe_bhop "0"             // 新玩家进服是否自动开启自动连跳（0=关，需 !ab）
sm_autostrafe_bhop_cmd "0"         // 自动连跳注入方式：0=改 usercmd 的 IN_JUMP（原来的做法）
                                   //   1 = 服务器命令 +jump/-jump 注入（学 VScript auto_bunnyhop 的 !bhop2）
                                   //       落地立刻 +jump、30ms 后 -jump；只有 listen server 房主有效
                                   //       CSV 速度数据两种一样，差别只在观感（预测修正），自己试             // 新玩家进服是否自动开启自动连跳（0=关，需 !ab）
sm_autostrafe_bhopgrace "0"        // 自动连跳抗丢包宽限（tick）：0=松手立即停；4-8 抗丢包但松手可能多跳 1 次
sm_autostrafe_bhopmin "220.0"      // 测试模式自动起跳的最低地速（正常游玩不限速）
sm_autostrafe_requiremove "1"      // 八向模式下是否必须按方向键才接管（普通模式不受影响）
sm_autostrafe_requirejump "0"      // 1=必须按住空格才接管空中加速；默认 0
sm_autostrafe_hysteresis "0"       // 换边死区（度）：0=每 tick 换边（画面最稳）；>0 轨迹摆幅变大

// ---------------- 引擎真值 ----------------
sm_autostrafe_enginetruth "1"      // 1=用 DHooks 读引擎当帧 W/accel/friction（最优 13,979.7/跳）；0=旧推测 13,955/跳
sm_autostrafe_viewfollow "0"       // 1=接管时把视角 yaw 对准速度方向（模仿第三方 autostrafer，可掩盖横向抖动，会改视角）
sm_autostrafe_power "5"            // 加速力度档位 1-5：1=最弱约 10,000/跳，5=最强 13,980/跳（玩家用 !asz 调整）

// ---------------- 参数覆盖（一般不要动） ----------------
sm_autostrafe_aa "0"               // 0=自动读 sv_airaccelerate；>0 强制
sm_autostrafe_wishspeed "0"        // 0=自动（引擎按 m_flMaxspeed 裁剪）；>0 强制
sm_autostrafe_maxspeed "0"         // 0=读 m_flMaxspeed；>0 强制
sm_autostrafe_dt "0"               // 0=GetTickInterval()；>0 强制（必须 <=0.1）
sm_autostrafe_friction "0"         // 0=自动（deadstrafe 用 deadfric）；>0 固定 surfaceFriction
sm_autostrafe_deadfric "0.25"      // deadstrafe 阶段的 surfaceFriction
sm_autostrafe_deadvz "125.0"       // 旧版 deadstrafe 判定 |vz| 阈值（引擎真值开启时不影响最终角度）
sm_autostrafe_deadmode "1"         // 旧版 deadstrafe 判定：0=关 1=上升段 2=下降段 3=两边

// ---------------- 测试 ----------------
sm_autostrafe_autotest "0"         // 出生后自动测试的秒数（0=关，正常游玩保持 0）
sm_autostrafe_testcircle "0"       // 测试用：固定一侧转向绕圈
sm_autostrafe_testduck "0"         // 测试用：跑满地速后按住蹲再起跳

// ---------------- 遥测 / 调试 ----------------
sm_autostrafe_log "0"              // 1=写 CSV（logs/autostrafe_l4d2.csv）
sm_autostrafe_logdetail "1"        // 1=只记实际接管行；2=连跳过原因也记
sm_autostrafe_debugchat "0"        // 1=每次决策在聊天区输出
sm_autostrafe_passive "0"          // 1=只记录、不改命令（对比用）

// ---------------- 直线跳 / 后跳（v1.14.1） ----------------
sm_autostrafe_mn_fwd_apex "1"       // 1=每跳过顶点(死亡阶段)折返一次，落地不改方向、下一跳继承（左->右->左）
                                    //   序列形如 ++++----0----++++0++++----0----++++，0 = 落地
                                    // 0=旧行为：按 mn_fwd_swing 摆角折返，长滞空可折返多次（蛇形）
sm_autostrafe_mn_fwd_swing "20"     // 单侧摆角（度）：仅 mn_fwd_apex=0 生效
sm_autostrafe_mn_fwd_extra "0"      // 换向那一帧镜头额外外甩（度）：实测真实摆动无瞬转，默认 0
sm_autostrafe_mn_fwd_flip "0.50"    // 折返时机（滞空进度 0.20~0.95）：0.50=过顶点折返（漂移最小）
                                    //   0.80=摆到接近极限再折返（摆幅最大，落地时已在回程）
                                    //   <0.5 会在上升段折返：不掉速（实测都是 618.8），但漂移方向反过来
sm_autostrafe_mn_fwd_period "12"   // 长滞空折返周期（tick）：第一次折返之后每过这么多 tick 再折一次
sm_autostrafe_mn_fwd_loop "1"      // 1=长滞空继续按周期折返；0=每跳只折一次（高跳低会单侧偏，但落地干净）
                                    //   平地一奔跑 18 tick，9 = 半跳 -> 平地仍然只折返一次
                                    //   高跳低没落地时自动多次折返，不会一路单侧拐
// ---------------- 甩视角强拐 v2（v1.14.12 重写） ----------------
// 旧版靠 theta=90+phi 刹车换转向，phi=25 时速度直接被废掉。
// 新版直接把速度方向朝视角转，转速可控、速度只微降。
sm_autostrafe_flick "1"             // 1=开启甩视角强拐；0=关闭（永远走最优加速转弯）
sm_autostrafe_flick_rate "200"      // 视角转速阈值（度/秒）：超过才算"甩"（v1.14.26 由 400 降到 200，更容易触发）
sm_autostrafe_flick_deg "25"        // 进入强拐的偏角（度）：视角与速度方向差这么多才强拐
                                    //   越小越敏感：25=小幅快甩就触发，45=要大甩（旧默认）
sm_autostrafe_flick_exit "15"       // 退出强拐的偏角（度）
sm_autostrafe_flick_turn "6.0"      // 强拐转速（度/tick）：6 = 360 度/秒，90 度弯约 15 tick（0.25 秒）
                                    //   10-12 更急（180 度约 0.15 秒），但预测修正更明显
sm_autostrafe_flick_keep "0.990"    // 每 tick 速度保留系数：0.99 = 转 90 度约损失 14%
                                    //   1.0 = 完全不掉速（转弯免费），0.98 = 掉得快但更像真物理

sm_autostrafe_mn_cam "1"            // 摆头是否接管视角：1=接管（镜头跟速度方向，画面持续旋转）
                                    //   0 = 完全不碰视角，只摆速度，画面稳如普通模式
sm_autostrafe_mn_sloppy "0"         // 垃圾摆动（0-100，%）：每 tick 有这个概率整 tick 不接管（零增益）
                                    //   0 = 每 tick 完美加速（正常）
                                    //   26 = 模拟真人摆不稳，10 跳约 390（实测 388.3），仍在加速但很慢
                                    //   50 = 更垃圾，几乎加不动
sm_autostrafe_mn_start "1"          // 首跳基准侧：1 = 第一跳先左（左-右-左交替，默认）
                                    //               2 = 第一跳先右（右-左-右交替）
                                    // 只翻转基准，交替规则不变，跨跳依然连续
sm_autostrafe_mn_brake "0"          // 摆动刹车角（度，0-80）：theta 再加这个角度，超过 90 就主动掉速
                                    //   0 = 正常最优加速（默认）
                                    //   10-20 = 轻微掉速（长滞空会慢慢压速度）
                                    //   30+ = 速度直接崩（实测 30 度：194 -> 34）
                                    //   注意命令层和 DHooks 钩子两层都加了这个角，缺一层会被拉回最优角
sm_autostrafe_mn_cam_rate "3.0"     // 摆头镜头每 tick 最大转角（度）：防起跳瞬间/折返时视角瞬抽
                                    //   3.0 = 与实机视频实测单帧 3.4° 同量级
                                    //   1.0 = 更柔和但跟得慢；0 = 不限幅（v1.14.0 旧行为，会抽）

// ---------------- 避障 ----------------
sm_autostrafe_avoid "0"             // 贴墙硬拐：1=前瞻 hull trace 判撞墙，提前换边（默认关）
sm_autostrafe_avoid_contact "3"     // 预测几 tick 内会碰墙就触发（1-8）
sm_autostrafe_avoid_hold "8"        // 硬拐保持 tick（2-16）
sm_autostrafe_avoid_debug "0"       // 1=聊天框输出避障决策

// ---- 僵尸 / 特感避让（v1.14.27）----
sm_autostrafe_avoid_mob "0"         // 1=空中避让僵尸/特感/Witch：探测前方锥形，保持最优角只翻推力方向
sm_autostrafe_avoid_mob_range "220" // 探测半径下限（单位）；实际用 max(这个值, 速度×0.85)
sm_autostrafe_avoid_mob_deg "75"    // 前方锥形半角（度）：摆头时速度方向左右摆 ±45，55 会一进一出
sm_autostrafe_avoid_mob_turn "20"   // 换边迟滞角（度）：目标偏角小于它时保持上次方向，防抖
sm_autostrafe_avoid_mob_hold "12"   // 单次避让最多持续 tick（0.4s），超过强制冷却，防绕圈
sm_autostrafe_avoid_mob_debug "0"   // 1=输出避让触发/解除（调试）

// ---------------- 测试用 ----------------
sm_autostrafe_testmob "0"           // 自动测试期间每隔 N 秒在身前生成一只僵尸（0=关，正常游玩保持 0）
